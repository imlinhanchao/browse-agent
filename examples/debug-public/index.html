<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Agent Debug Console</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2e3a;
      --text: #e1e4eb;
      --muted: #8b8fa3;
      --accent: #6c8cff;
      --accent-hover: #5a7aee;
      --success: #4ade80;
      --error: #f87171;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Layout */
    .app { display: flex; height: 100vh; }
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar h1 {
      font-size: 14px;
      padding: 0 16px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .sidebar .status {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .status .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .status .dot.on { background: var(--success); }
    .status .dot.off { background: var(--error); }
    .nav-group { padding: 4px 0; }
    .nav-group-title {
      padding: 4px 16px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .nav-item {
      display: block;
      width: 100%;
      padding: 7px 16px;
      border: none;
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background .15s;
    }
    .nav-item:hover { background: rgba(108,140,255,.1); }
    .nav-item.active { background: rgba(108,140,255,.18); color: var(--accent); }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header {
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 20px; }

    /* Sections (hidden by default) */
    .section { display: none; }
    .section.active { display: block; }

    /* Forms */
    .form-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group.grow { flex: 1; min-width: 200px; }
    label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    input, select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    button.btn {
      padding: 8px 18px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    button.btn:hover { background: var(--accent-hover); }
    button.btn:disabled { opacity: .5; cursor: not-allowed; }
    button.btn.danger { background: #ef4444; }
    button.btn.danger:hover { background: #dc2626; }

    /* Output */
    .output-block {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0,0,0,.2);
      font-size: 11px;
      color: var(--muted);
    }
    .output-header .tag {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }
    .tag.ok { background: rgba(74,222,128,.15); color: var(--success); }
    .tag.err { background: rgba(248,113,113,.15); color: var(--error); }
    .output-body {
      padding: 12px;
      max-height: 400px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 12px;
      line-height: 1.6;
    }

    /* Screenshot preview */
    .screenshot-preview {
      margin-top: 12px;
      text-align: center;
    }
    .screenshot-preview img {
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* Tabs table */
    .tabs-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    .tabs-table th, .tabs-table td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .tabs-table th {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(0,0,0,.2);
    }
    .tabs-table td { font-size: 12px; }
    .tabs-table .url-cell {
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* DOM Tree */
    .dom-tree {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.7;
      padding: 12px;
      overflow: auto;
      max-height: 600px;
    }
    .dom-tree ul {
      list-style: none;
      padding-left: 20px;
      margin: 0;
      border-left: 1px solid var(--border);
    }
    .dom-tree > ul { border-left: none; padding-left: 0; }
    .dom-tree li { position: relative; }
    .dom-node { display: inline; }
    .dom-toggle {
      display: inline-block;
      width: 16px;
      text-align: center;
      cursor: pointer;
      color: var(--muted);
      user-select: none;
      font-size: 10px;
      vertical-align: middle;
    }
    .dom-toggle:hover { color: var(--accent); }
    .dom-tag { color: #e06c75; }
    .dom-attr-name { color: #d19a66; }
    .dom-attr-value { color: #98c379; }
    .dom-text {
      color: var(--text);
      opacity: 0.8;
      font-style: italic;
    }
    .dom-comment { color: var(--muted); font-style: italic; }
    .dom-bracket { color: var(--muted); }
    .dom-children.collapsed { display: none; }
    .dom-ellipsis {
      color: var(--muted);
      cursor: pointer;
      background: rgba(108,140,255,.08);
      padding: 0 4px;
      border-radius: 3px;
      font-size: 11px;
    }
    .dom-ellipsis:hover { background: rgba(108,140,255,.18); }
    .dom-node-inline { display: inline; }
    /* View mode tabs */
    .view-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 0;
    }
    .view-tab {
      padding: 6px 16px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .15s;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .view-pane { display: none; }
    .view-pane.active { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h1>🛠 Debug Console</h1>
      <div class="status" id="statusBar">
        <span class="dot off" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">Navigation</div>
        <button class="nav-item active" data-section="navigate">Navigate</button>
        <button class="nav-item" data-section="getContent">Get Content</button>
        <button class="nav-item" data-section="tabs">List / Close Tabs</button>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">Injection</div>
        <button class="nav-item" data-section="injectScript">Inject Script</button>
        <button class="nav-item" data-section="injectCSS">Inject CSS</button>
        <button class="nav-item" data-section="evaluate">Evaluate JS</button>
        <button class="nav-item" data-section="getDOM">Get DOM</button>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">Screenshot</div>
        <button class="nav-item" data-section="screenshotVisible">Visible</button>
        <button class="nav-item" data-section="screenshotFullPage">Full Page</button>
        <button class="nav-item" data-section="screenshotArea">Area</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="panel-header" id="panelTitle">Navigate</div>
      <div class="panel-body">

        <!-- Navigate -->
        <div class="section active" id="sec-navigate">
          <div class="form-row">
            <div class="form-group grow">
              <label>URL</label>
              <input type="text" id="navUrl" placeholder="https://example.com" value="https://example.com">
            </div>
            <div class="form-group">
              <label>Wait for Load</label>
              <select id="navWait"><option value="true">Yes</option><option value="false">No</option></select>
            </div>
            <button class="btn" onclick="doNavigate()">Open</button>
          </div>
          <div id="navOutput"></div>
        </div>

        <!-- Get Content -->
        <div class="section" id="sec-getContent">
          <div class="form-row">
            <div class="form-group">
              <label>Tab ID (blank=active)</label>
              <input type="number" id="gcTabId" placeholder="auto">
            </div>
            <div class="form-group">
              <label>Format</label>
              <select id="gcFormat"><option value="html">HTML</option><option value="text">Text</option></select>
            </div>
            <button class="btn" onclick="doGetContent()">Get</button>
          </div>
          <div id="gcOutput"></div>
        </div>

        <!-- Tabs -->
        <div class="section" id="sec-tabs">
          <div class="form-row">
            <button class="btn" onclick="doListTabs()">Refresh Tabs</button>
          </div>
          <div id="tabsOutput"></div>
        </div>

        <!-- Inject Script -->
        <div class="section" id="sec-injectScript">
          <div class="form-row">
            <div class="form-group">
              <label>Tab ID (blank=active)</label>
              <input type="number" id="isTabId" placeholder="auto">
            </div>
          </div>
          <div class="form-group" style="margin-bottom:12px">
            <label>JavaScript Code</label>
            <textarea id="isCode" rows="6" placeholder="document.title = 'Hello';">document.title = 'Hello from Browse Agent';</textarea>
          </div>
          <button class="btn" onclick="doInjectScript()">Inject</button>
          <div id="isOutput"></div>
        </div>

        <!-- Inject CSS -->
        <div class="section" id="sec-injectCSS">
          <div class="form-row">
            <div class="form-group">
              <label>Tab ID (blank=active)</label>
              <input type="number" id="icTabId" placeholder="auto">
            </div>
          </div>
          <div class="form-group" style="margin-bottom:12px">
            <label>CSS Code</label>
            <textarea id="icCode" rows="6" placeholder="body { background: yellow !important; }">body { background: #1a1a2e !important; color: #eee !important; }</textarea>
          </div>
          <button class="btn" onclick="doInjectCSS()">Inject</button>
          <div id="icOutput"></div>
        </div>

        <!-- Evaluate -->
        <div class="section" id="sec-evaluate">
          <div class="form-row">
            <div class="form-group">
              <label>Tab ID (blank=active)</label>
              <input type="number" id="evTabId" placeholder="auto">
            </div>
          </div>
          <div class="form-group" style="margin-bottom:12px">
            <label>Expression</label>
            <textarea id="evExpr" rows="3" placeholder="document.title">({ title: document.title, url: location.href, links: document.querySelectorAll('a').length })</textarea>
          </div>
          <button class="btn" onclick="doEvaluate()">Evaluate</button>
          <div id="evOutput"></div>
        </div>

        <!-- Get DOM -->
        <div class="section" id="sec-getDOM">
          <div class="form-row">
            <div class="form-group grow">
              <label>CSS Selector</label>
              <input type="text" id="domSelector" placeholder="h1" value="h1">
            </div>
            <div class="form-group">
              <label>Property</label>
              <input type="text" id="domProp" list="domPropList" value="innerText" placeholder="e.g. innerText">
              <datalist id="domPropList">
                <option value="outerHTML">
                <option value="innerHTML">
                <option value="innerText">
                <option value="textContent">
                <option value="className">
                <option value="id">
                <option value="href">
                <option value="src">
                <option value="value">
              </datalist>
            </div>
            <div class="form-group">
              <label>Match All</label>
              <select id="domAll"><option value="false">First</option><option value="true" selected>All</option></select>
            </div>
            <div class="form-group">
              <label>Tab ID</label>
              <input type="number" id="domTabId" placeholder="auto" style="width:80px">
            </div>
            <button class="btn" onclick="doGetDOM()">Query</button>
          </div>
          <div id="domOutput"></div>
        </div>

        <!-- Screenshot Visible -->
        <div class="section" id="sec-screenshotVisible">
          <div class="form-row">
            <div class="form-group">
              <label>Tab ID (blank=active)</label>
              <input type="number" id="svTabId" placeholder="auto">
            </div>
            <div class="form-group">
              <label>Format</label>
              <select id="svFmt"><option value="png">PNG</option><option value="jpeg">JPEG</option></select>
            </div>
            <button class="btn" onclick="doScreenshotVisible()">Capture</button>
          </div>
          <div id="svOutput"></div>
        </div>

        <!-- Screenshot Full Page -->
        <div class="section" id="sec-screenshotFullPage">
          <div class="form-row">
            <div class="form-group">
              <label>Tab ID (blank=active)</label>
              <input type="number" id="sfTabId" placeholder="auto">
            </div>
            <div class="form-group">
              <label>Format</label>
              <select id="sfFmt"><option value="png">PNG</option><option value="jpeg">JPEG</option></select>
            </div>
            <button class="btn" onclick="doScreenshotFullPage()">Capture</button>
          </div>
          <div id="sfOutput"></div>
        </div>

        <!-- Screenshot Area -->
        <div class="section" id="sec-screenshotArea">
          <div class="form-row">
            <div class="form-group">
              <label>Tab ID</label>
              <input type="number" id="saTabId" placeholder="auto" style="width:80px">
            </div>
            <div class="form-group">
              <label>X</label>
              <input type="number" id="saX" value="0" style="width:80px">
            </div>
            <div class="form-group">
              <label>Y</label>
              <input type="number" id="saY" value="0" style="width:80px">
            </div>
            <div class="form-group">
              <label>Width</label>
              <input type="number" id="saW" value="800" style="width:80px">
            </div>
            <div class="form-group">
              <label>Height</label>
              <input type="number" id="saH" value="600" style="width:80px">
            </div>
            <div class="form-group">
              <label>Format</label>
              <select id="saFmt"><option value="png">PNG</option><option value="jpeg">JPEG</option></select>
            </div>
            <button class="btn" onclick="doScreenshotArea()">Capture</button>
          </div>
          <div id="saOutput"></div>
        </div>

      </div><!-- /panel-body -->
    </main>
  </div>

<script>
// ── Helpers ─────────────────────────────────────────────
function val(id) { return document.getElementById(id).value.trim(); }
function numOrUndef(id) { const v = val(id); return v ? Number(v) : undefined; }

async function api(endpoint, options = {}) {
  const method = options.method || (options.body ? 'POST' : 'GET');
  const res = await fetch('/api/' + endpoint, {
    method,
    headers: options.body ? { 'Content-Type': 'application/json' } : {},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function renderOutput(containerId, data, { isError = false, duration = 0 } = {}) {
  const c = document.getElementById(containerId);
  const json = JSON.stringify(data, null, 2);
  c.innerHTML = `
    <div class="output-block">
      <div class="output-header">
        <span>${duration}ms</span>
        <span class="tag ${isError ? 'err' : 'ok'}">${isError ? 'ERROR' : 'OK'}</span>
      </div>
      <div class="output-body">${escapeHtml(json)}</div>
    </div>`;
}

function renderScreenshot(containerId, data, duration) {
  const c = document.getElementById(containerId);
  const fmt = data.format || 'png';
  c.innerHTML = `
    <div class="output-block">
      <div class="output-header">
        <span>${duration}ms &nbsp; ${data.width || '?'}×${data.height || '?'} &nbsp; ${(data.data.length / 1024).toFixed(1)}KB base64</span>
        <span class="tag ok">OK</span>
      </div>
    </div>
    <div class="screenshot-preview">
      <img src="data:image/${fmt};base64,${data.data}" alt="screenshot">
    </div>`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── DOM Tree Renderer ───────────────────────────────────
function renderDomTree(htmlString) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlString, 'text/html');

  function hasVisibleContent(node) {
    if (node.nodeType === 3) return node.textContent.trim().length > 0;
    if (node.nodeType === 8) return true;
    if (node.nodeType === 1) return true;
    return false;
  }

  function buildNode(node) {
    if (node.nodeType === 3) {
      const text = node.textContent.trim();
      if (!text) return '';
      const display = text.length > 120 ? text.slice(0, 120) + '…' : text;
      return `<span class="dom-text">${escapeHtml(display)}</span>`;
    }

    if (node.nodeType === 8) {
      const text = node.textContent.trim();
      return `<span class="dom-comment">&lt;!-- ${escapeHtml(text)} --&gt;</span>`;
    }

    if (node.nodeType !== 1) return '';

    const tag = node.tagName.toLowerCase();
    let attrs = '';
    for (const attr of node.attributes) {
      attrs += ` <span class="dom-attr-name">${escapeHtml(attr.name)}</span>`;
      if (attr.value) {
        attrs += `=<span class="dom-attr-value">"${escapeHtml(attr.value)}"</span>`;
      }
    }

    const voidTags = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
    if (voidTags.has(tag)) {
      return `<span class="dom-bracket">&lt;</span><span class="dom-tag">${tag}</span>${attrs}<span class="dom-bracket"> /&gt;</span>`;
    }

    const children = Array.from(node.childNodes).filter(hasVisibleContent);

    // Leaf or text-only node: render inline
    if (children.length === 0) {
      return `<span class="dom-bracket">&lt;</span><span class="dom-tag">${tag}</span>${attrs}<span class="dom-bracket">&gt;&lt;/</span><span class="dom-tag">${tag}</span><span class="dom-bracket">&gt;</span>`;
    }

    if (children.length === 1 && children[0].nodeType === 3 && children[0].textContent.trim().length < 80) {
      const text = children[0].textContent.trim();
      return `<span class="dom-bracket">&lt;</span><span class="dom-tag">${tag}</span>${attrs}<span class="dom-bracket">&gt;</span><span class="dom-text">${escapeHtml(text)}</span><span class="dom-bracket">&lt;/</span><span class="dom-tag">${tag}</span><span class="dom-bracket">&gt;</span>`;
    }

    // Node with children: collapsible
    const id = 'dn' + Math.random().toString(36).slice(2, 8);
    let childrenHtml = '';
    for (const child of children) {
      const rendered = buildNode(child);
      if (rendered) childrenHtml += `<li>${rendered}</li>`;
    }

    return `<span class="dom-toggle" onclick="toggleDomNode('${id}')">▼</span><span class="dom-bracket">&lt;</span><span class="dom-tag">${tag}</span>${attrs}<span class="dom-bracket">&gt;</span><span class="dom-ellipsis" id="${id}-ellipsis" style="display:none" onclick="toggleDomNode('${id}')">…</span><ul class="dom-children" id="${id}">${childrenHtml}</ul><span class="dom-bracket">&lt;/</span><span class="dom-tag">${tag}</span><span class="dom-bracket">&gt;</span>`;
  }

  // Build from html/head/body
  let items = '';
  const doctype = '<!DOCTYPE html>';
  items += `<li><span class="dom-comment">${escapeHtml(doctype)}</span></li>`;
  const htmlEl = doc.documentElement;
  if (htmlEl) {
    items += `<li>${buildNode(htmlEl)}</li>`;
  }

  return `<ul>${items}</ul>`;
}

function toggleDomNode(id) {
  const ul = document.getElementById(id);
  const ellipsis = document.getElementById(id + '-ellipsis');
  const toggle = ul.parentElement.querySelector('.dom-toggle');
  if (ul.classList.contains('collapsed')) {
    ul.classList.remove('collapsed');
    ellipsis.style.display = 'none';
    toggle.textContent = '▼';
  } else {
    ul.classList.add('collapsed');
    ellipsis.style.display = 'inline';
    toggle.textContent = '▶';
  }
}

function renderContentOutput(containerId, data, duration) {
  const c = document.getElementById(containerId);
  const content = data.content || '';
  const isHtml = (data.format === 'html' || content.trim().startsWith('<'));

  let treeHtml = '';
  if (isHtml) {
    try { treeHtml = renderDomTree(content); } catch(e) { treeHtml = `<div style="color:var(--error)">Tree parse error: ${escapeHtml(e.message)}</div>`; }
  }

  const json = JSON.stringify(data, null, 2);
  const hasTree = isHtml && treeHtml;

  c.innerHTML = `
    <div class="output-block">
      <div class="output-header">
        <span>${duration}ms &nbsp; ${(content.length / 1024).toFixed(1)}KB</span>
        <span class="tag ok">OK</span>
      </div>
      ${hasTree ? `
      <div style="padding: 0 12px; border-bottom: 1px solid var(--border);">
        <div class="view-tabs">
          <button class="view-tab active" onclick="switchContentView(this, '${containerId}', 'tree')">DOM Tree</button>
          <button class="view-tab" onclick="switchContentView(this, '${containerId}', 'raw')">Raw</button>
        </div>
      </div>
      <div class="view-pane active dom-tree" data-view="tree" data-container="${containerId}">${treeHtml}</div>
      <div class="view-pane output-body" data-view="raw" data-container="${containerId}">${escapeHtml(json)}</div>
      ` : `<div class="output-body">${escapeHtml(json)}</div>`}
    </div>`;
}

function switchContentView(btn, containerId, view) {
  const block = btn.closest('.output-block');
  block.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  block.querySelectorAll('.view-pane').forEach(p => {
    p.classList.toggle('active', p.dataset.view === view);
  });
}

async function run(outputId, fn) {
  const t0 = performance.now();
  try {
    const data = await fn();
    const ms = Math.round(performance.now() - t0);
    return { data, ms };
  } catch (e) {
    const ms = Math.round(performance.now() - t0);
    renderOutput(outputId, { error: e.message }, { isError: true, duration: ms });
    return null;
  }
}

// ── Nav ─────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    const sec = btn.dataset.section;
    document.getElementById('sec-' + sec).classList.add('active');
    document.getElementById('panelTitle').textContent = btn.textContent.trim();
  });
});

// ── Status polling ──────────────────────────────────────
async function pollStatus() {
  try {
    const s = await api('status');
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    dot.className = 'dot ' + (s.connected ? 'on' : 'off');
    txt.textContent = s.connected ? 'Connected' : 'Disconnected';
  } catch {}
}
pollStatus();
setInterval(pollStatus, 3000);

// ── API Calls ───────────────────────────────────────────
async function doNavigate() {
  const r = await run('navOutput', () => api('navigate', {
    body: { url: val('navUrl'), waitForLoad: val('navWait') === 'true' }
  }));
  if (r) renderOutput('navOutput', r.data, { duration: r.ms });
}

async function doGetContent() {
  const r = await run('gcOutput', () => api('getContent', {
    body: { tabId: numOrUndef('gcTabId'), format: val('gcFormat') }
  }));
  if (r) renderContentOutput('gcOutput', r.data, r.ms);
}

async function doListTabs() {
  const r = await run('tabsOutput', () => api('tabs'));
  if (!r) return;
  const { tabs } = r.data;
  let html = `<table class="tabs-table">
    <thead><tr><th>ID</th><th>Title</th><th>URL</th><th>Active</th><th></th></tr></thead><tbody>`;
  for (const t of tabs) {
    html += `<tr>
      <td>${t.id}</td>
      <td>${escapeHtml(t.title || '')}</td>
      <td class="url-cell" title="${escapeHtml(t.url)}">${escapeHtml(t.url)}</td>
      <td>${t.active ? '●' : ''}</td>
      <td><button class="btn danger" style="padding:4px 10px;font-size:11px" onclick="doCloseTab(${t.id})">Close</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('tabsOutput').innerHTML = html;
}

async function doCloseTab(tabId) {
  const r = await run('tabsOutput', () => api('closeTab', { body: { tabId } }));
  if (r) doListTabs();
}

async function doInjectScript() {
  const r = await run('isOutput', () => api('injectScript', {
    body: { code: val('isCode'), tabId: numOrUndef('isTabId') }
  }));
  if (r) renderOutput('isOutput', r.data, { duration: r.ms });
}

async function doInjectCSS() {
  const r = await run('icOutput', () => api('injectCSS', {
    body: { code: val('icCode'), tabId: numOrUndef('icTabId') }
  }));
  if (r) renderOutput('icOutput', r.data, { duration: r.ms });
}

async function doEvaluate() {
  const r = await run('evOutput', () => api('evaluate', {
    body: { expression: val('evExpr'), tabId: numOrUndef('evTabId') }
  }));
  if (r) renderOutput('evOutput', r.data, { duration: r.ms });
}

async function doGetDOM() {
  const r = await run('domOutput', () => api('getDOM', {
    body: {
      selector: val('domSelector'),
      tabId: numOrUndef('domTabId'),
      property: val('domProp'),
      all: val('domAll') === 'true',
    }
  }));
  if (r) renderOutput('domOutput', r.data, { duration: r.ms });
}

async function doScreenshotVisible() {
  const r = await run('svOutput', () => api('screenshotVisible', {
    body: { tabId: numOrUndef('svTabId'), format: val('svFmt') }
  }));
  if (r) renderScreenshot('svOutput', r.data, r.ms);
}

async function doScreenshotFullPage() {
  const r = await run('sfOutput', () => api('screenshotFullPage', {
    body: { tabId: numOrUndef('sfTabId'), format: val('sfFmt') }
  }));
  if (r) renderScreenshot('sfOutput', r.data, r.ms);
}

async function doScreenshotArea() {
  const r = await run('saOutput', () => api('screenshotArea', {
    body: {
      tabId: numOrUndef('saTabId'),
      x: Number(val('saX')),
      y: Number(val('saY')),
      width: Number(val('saW')),
      height: Number(val('saH')),
      format: val('saFmt'),
    }
  }));
  if (r) renderScreenshot('saOutput', r.data, r.ms);
}
</script>
</body>
